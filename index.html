<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" /> <!-- ビューポートの設定 -->
		<meta name="format-detection" content="telephone=no" /> <!-- 電話番号の自動リンクを無効化 for iPhone -->
		<meta charset="UTF-8" />
		<meta name="author" content="360dig" />
		<meta name="description" content="360dig" />
		<meta name="keywords" content="360dig" />

		<title>360dig</title>

		<!-- ▼ ファビコン＆ホーム画面用アイコン ▼ -->
		<link rel="shortcut icon" type="image/vnd.microsoft.icon" href="./files/favicon.ico" />
		<link rel="icon" type="image/vnd.microsoft.icon" href="./files/favicon.ico"	 />
		<link rel="apple-touch-icon" href="./files/apple-touch-icon.png" />
		<!-- ▲ ファビコン＆ホーム画面用アイコン ▲ -->

		<!-- ▼ CSS ▼ -->
		<link rel="stylesheet" href="./files/reset.css" />						<!-- リセット用 CSS -->
		<link rel="stylesheet" href="./files/common.css" />						<!-- サイト内共通 CSS -->
		<link rel="stylesheet" href="./files/pannellum.css" />

		<style>
			body {
				text-align: center;
			}

			h1 {
				margin: 1em 0;
				font-size: 2em;
			}

			div {
				box-sizing: border-box;
			}

			#container {
				padding: 20px;
			}

			/* パノラマ画像 */
			#panorama {
				position: relative;
				margin: 0 auto;
			  width: 100%;
			  height: 75vw;
			  max-width: 640px;
			  max-height: 480px;
			}

			/* 360°アイコン */
			#panorama::after {
				display: inline-block;
				position: absolute;
				top: 20px;
				right: 20px;
				content: "";
				width:80px;
				height: 80px;
				background-image: url('./files/360-icon.webp');
				background-size: cover;
				pointer-events: none;
			}

		</style>
		<!-- ▲ CSS ▲ -->
	</head>
	<body>

		<!-- ▼ コンテナ ▼ -->
		<div id="container">

			<!-- ▼ メイン ▼ -->
			<div id="main">
				<h1>pannellum を使った表示</h1>
				<div id="panorama"><!-- パノラマ画像 --></div>
			</div>	<!-- /#main -->
			<!-- ▲ メイン ▲ -->

		</div>	<!-- /#container -->
		<!-- ▲ コンテナ ▲ -->

		<!-- ▼ jQuery ▼ -->
		<script src="./files/jquery-1.12.4.min.js"></script>
		<script src="./files/common.js"></script>
		<script src="./files/pannellum.js"></script>
	 
		<script>
			pannellum.viewer('panorama', {
			  "type": "equirectangular",
			  "panorama": "./files/20260122_133236.jpg",	/* ★★★ パノラマ画像を指定 ★★★ */
				"autoRotate": -2,
			  "autoLoad": true
			});
		</script>
		<!-- ▲ jQuery ▲ -->
	</body>
</html>
