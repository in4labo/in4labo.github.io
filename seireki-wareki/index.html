<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>西暦-和暦 対応表 (何年前付き)</title>

<!-- ▼ ファビコン＆ホーム画面用アイコン ▼ -->
<link rel="shortcut icon" type="image/vnd.microsoft.icon" href="./files/favicon.ico" />
<link rel="icon" type="image/vnd.microsoft.icon" href="./files/favicon.ico"	 />
<link rel="apple-touch-icon" href="./files/apple-touch-icon.png" />
<!-- ▲ ファビコン＆ホーム画面用アイコン ▲ -->

<style>
  table { border-collapse: collapse; width: 100%; max-width: 700px; margin: 20px auto; font-family: sans-serif; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  th { background-color: #f0f0f0; }
  .ganen { font-weight: bold; color: #d32f2f; }
  .overlap { background-color: #fffde7; }
  /* 何年前の列のスタイル */
  .years-ago { font-family: monospace; color: #555; }
  .current-year { font-weight: bold; color: #2e7d32; background-color: #e8f5e9; }
</style>
</head>
<body>

<h2 style="text-align:center;">西暦 - 和暦 対応表</h2>
<div id="calendar-table"></div>

<script>
function displayCalendarTable() {
  const currentYear = new Date().getFullYear(); // 2026
  const startYear = 1868; // 明治元年
  
  const eras = [
    { name: '明治', start: 18680908, end: 19120730 },
    { name: '大正', start: 19120730, end: 19261225 },
    { name: '昭和', start: 19261225, end: 19890107 },
    { name: '平成', start: 19890108, end: 20190430 },
    { name: '令和', start: 20190501, end: 20991231 }
  ];

//  let html = '<table><thead><tr><th>西暦</th><th>何年前</th><th>和暦</th><th>元号</th></tr></thead><tbody>';

  let html = '<table><thead><tr><th>西暦</th><th>何年前</th><th>和暦</th></tr></thead><tbody>';


  for (let year = currentYear; year >= startYear; year--) {
    // 「何年前」の計算 (今年=0, 去年=1, ...)
    const yearsAgo = currentYear - year;
    
    const checkDate = parseInt(`${year}1231`);
    let eraName = '';
    let eraYear = 0;
    let isOverlap = false;
    let overlapText = '';

    for (const era of eras) {
      if (checkDate >= era.start && checkDate <= era.end) {
        eraName = era.name;
        eraYear = year - Math.floor(era.start / 10000) + 1;
        break;
      }
    }

    // 切り替わり年の検出
    const startOfDay = parseInt(`${year}0101`);
    let eraNameStart = '';
    for (const era of eras) {
      if (startOfDay >= era.start && startOfDay <= era.end) {
        eraNameStart = era.name;
        break;
      }
    }

    if (eraName !== eraNameStart && eraNameStart !== '') {
      isOverlap = true;
      const eraYearStart = year - Math.floor(eras.find(e => e.name === eraNameStart).start / 10000) + 1;
      const yearStrStart = eraYearStart === 1 ? '元年' : `${eraYearStart}年`;
      const yearStrEnd = eraYear === 1 ? '元年' : `${eraYear}年`;
      overlapText = `${eraNameStart}${yearStrStart} / ${eraName}${yearStrEnd}`;
    }

    const yearStr = eraYear === 1 ? '元年' : `${eraYear}年`;
    const displayWareki = isOverlap ? overlapText : `${eraName}${yearStr}`;
    
    const rowClass = isOverlap ? 'overlap' : (yearsAgo === 0 ? 'current-year' : '');
    const warekiClass = eraYear === 1 ? 'ganen' : '';

    html += `<tr class="${rowClass}">
      <td>${year}年</td>
      <td class="years-ago">${yearsAgo}年前</td>
      <td class="${warekiClass}">${displayWareki}</td>
<!--
      <td>${eraName}</td>
-->
    </tr>`;
  }

  html += '</tbody></table>';
  document.getElementById('calendar-table').innerHTML = html;
}

displayCalendarTable();
</script>

</body>
</html>
